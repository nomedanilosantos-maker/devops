name: CI/CD DevOps Lab

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build artefact
        run: |
          mkdir -p build
          echo "Build gerado em $(date)" > build/info.txt

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: devops-build
          path: build/

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Download artefact
        uses: actions/download-artifact@v4
        with:
          name: devops-build
          path: deploy

      - name: Simulated deploy to DEV server
        run: |
          mkdir -p /tmp/dev-server
          cp -r deploy/* /tmp/dev-server/
          echo "Conteúdo no servidor DEV:"
          ls -l /tmp/dev-server

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Download artefact
        uses: actions/download-artifact@v4
        with:
          name: devops-build
          path: deploy

      - name: Simulated deploy to PROD server
        run: |
          mkdir -p /tmp/prod-server
          cp -r deploy/* /tmp/prod-server/
          echo "Conteúdo no servidor PROD:"
          ls -l /tmp/prod-server
